# Coolify/Nixpacks — app principal (Next.js).
#
# Trava o build/start de PRODUÇÃO. Sem este arquivo, o Coolify dependia do
# comando configurado no painel — que estava em `next dev` e servia o site sem
# CSS no mobile (o dev server troca os nomes dos chunks a cada recompile, então
# navegadores com a aba em cache pedem URLs de CSS/JS que já não existem -> 404).
#
# build:clean é só para uso local — no Coolify o cache Docker monta em
# .next/cache e o rmSync falha com EBUSY. Aqui usamos `next build` direto.
providers = ["node"]

# Coolify/Nixpacks define NODE_ENV=production — sem isso o npm omite
# devDependencies e o build quebra ao carregar @tailwindcss/postcss.
# O Postgres do Coolify é 18. O cliente do Ubuntu 24.04 é 16 e o pg_dump
# recusa o dump. O cliente 18 vem do repositório oficial, sem o pacote nix.
[phases.install]
cmds = [
  "npm ci --include=dev --no-audit --no-fund",
  "sudo apt-get update && sudo apt-get install -y --no-install-recommends ca-certificates curl && sudo install -d /usr/share/postgresql-common/pgdg && sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc && echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list && sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-18",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

[variables]
NEXT_TELEMETRY_DISABLED = "1"
NODE_OPTIONS = "--max-old-space-size=4096"
NPM_CONFIG_PRODUCTION = "false"
